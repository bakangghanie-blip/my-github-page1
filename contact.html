<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertec | Get In Touch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="container">
        <div class="logo">Cybertec</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="solutions.html">Solutions</a></li>
                <li><a href="contact.html" class="active">Get In Touch</a></li>
                <li><a href="tips.html">Tips</a></li>
            </ul>
            <div class="hamburger">&#9776;</div>
        </nav>
    </div>
</header>

<main>
    <section class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Ready to secure your business? Fill out the form below and we'll get back to you.</p>
        </div>
    </section>

    <section class="contact-form-section">
        <div class="container">
            <div class="contact-wrapper">
                <form id="feedbackForm" action="#" method="post" novalidate>
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="Jane Smith">
                        <div class="error-message" id="nameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="jane@company.com">
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="company">Your Company</label>
                        <input type="text" id="company" name="company" placeholder="Company Name">
                    </div>

                    <div class="form-group">
                        <label for="service">Service Selection *</label>
                        <select id="service" name="service" required>
                            <option value="">Select...</option>
                            <option value="penetration">Penetration Testing</option>
                            <option value="firewall">Firewall Installations</option>
                            <option value="backup">Backup Services</option>
                            <option value="audit">Security Audits</option>
                            <option value="antivirus">Anti-Virus/Malware</option>
                            <option value="maintenance">Maintenance Agreements</option>
                        </select>
                        <div class="error-message" id="serviceError"></div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message / Additional Info</label>
                        <textarea id="message" name="message" rows="4" placeholder="Tell us about your security needs..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit Request</button>
                    <p id="formSuccess" style="display:none; color:green; margin-top:1rem;"></p>
                </form>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Cybertec. All rights reserved. | Your Security, Our Priority</p>
    </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
